name: rosedine
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.1 <4.0.0'

dependencies:
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.2.3
  android_alarm_manager_plus: ^4.0.4
  flutter_local_notifications: ^18.0.1
  url_launcher: ^6.3.0
  flutter:
    sdk: flutter
  http: ^1.2.2
  email_validator: ^3.0.0
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/RoseDine.jpg
    - assets/RoseDine_2.jpg
    - assets/RoseDine3.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/RoseDine.jpg"  # Path to your icon file
  min_sdk_android: 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/RoseDine.jpg"
